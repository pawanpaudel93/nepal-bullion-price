<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#1C1917"/>
  <g transform="translate(96, 96) scale(10)">
    <!-- Bucket body -->
    <path d="M4 14h24l-3 14H7L4 14z" fill="#EAB308" stroke="#CA8A04" stroke-width="1"/>
    <!-- Bucket rim -->
    <path d="M3.5 13.5h25a1.2 1.2 0 0 1 0 2.4h-25a1.2 1.2 0 0 1 0-2.4z" fill="#CA8A04" stroke="#A16207" stroke-width="0.5"/>
    <!-- Rivet lines -->
    <path d="M11 15.5v11M21 15.5v11" stroke="#CA8A04" stroke-width="0.5" opacity="0.3"/>
    <!-- Gold balls — back row -->
    <circle cx="11" cy="9.5" r="3" fill="#FACC15" stroke="#CA8A04" stroke-width="0.75"/>
    <circle cx="21" cy="9.5" r="3" fill="#EAB308" stroke="#A16207" stroke-width="0.75"/>
    <!-- Gold ball — front center -->
    <circle cx="16" cy="7.5" r="3.2" fill="#FDE047" stroke="#CA8A04" stroke-width="0.75"/>
    <!-- Gold bar peeking out -->
    <rect x="9" y="11.5" width="14" height="3.5" rx="0.6" fill="#FACC15" stroke="#CA8A04" stroke-width="0.5"/>
    <!-- Shine on top ball -->
    <circle cx="14.8" cy="6.4" r="0.9" fill="white" opacity="0.5"/>
  </g>
</svg>
